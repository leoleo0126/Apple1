name: Build Apple Game Auto

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/example/applegameauto
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          # --------------------------------------------------
          # settings.gradle
          # --------------------------------------------------

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AppleGameAuto"

          include(":app")
          EOF

          # --------------------------------------------------
          # build.gradle
          # --------------------------------------------------

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          # --------------------------------------------------
          # gradle.properties
          # --------------------------------------------------

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          # --------------------------------------------------
          # app/build.gradle
          # --------------------------------------------------

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.applegameauto'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.applegameauto'
                  minSdk 26
                  targetSdk 35
                  versionCode 3
                  versionName '3.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false

                      proguardFiles(
                          getDefaultProguardFile(
                              'proguard-android-optimize.txt'
                          ),
                          'proguard-rules.pro'
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.core:core:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'

              implementation 'com.google.mlkit:text-recognition:16.0.1'
          }
          EOF

          # --------------------------------------------------
          # ProGuard
          # --------------------------------------------------

          cat > app/proguard-rules.pro <<'EOF'
          # No custom rules.
          EOF

          # --------------------------------------------------
          # AndroidManifest.xml
          # --------------------------------------------------

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

                  <service
                      android:name=".AppleAccessibilityService"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">

                      <intent-filter>

                          <action
                              android:name="android.accessibilityservice.AccessibilityService" />

                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

                  <service
                      android:name=".GameCaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

              </application>

          </manifest>
          EOF

          # --------------------------------------------------
          # strings.xml
          # --------------------------------------------------

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">
                  사과게임 자동 플레이
              </string>

              <string name="accessibility_service_description">
                  사과게임의 숫자를 선택하기 위해 화면을 드래그합니다.
              </string>

          </resources>
          EOF

          # --------------------------------------------------
          # themes.xml
          # --------------------------------------------------

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">#555555</item>

                  <item name="android:navigationBarColor">
                      #FFFFFF
                  </item>

                  <item name="android:statusBarColor">
                      #FFFFFF
                  </item>

                  <item name="android:windowLightStatusBar">
                      true
                  </item>

              </style>

          </resources>
          EOF

          # --------------------------------------------------
          # accessibility_service_config.xml
          # --------------------------------------------------

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"

              android:description="@string/accessibility_service_description"

              android:accessibilityEventTypes="typeAllMask"

              android:accessibilityFeedbackType="feedbackGeneric"

              android:notificationTimeout="100"

              android:canRetrieveWindowContent="false"

              android:canPerformGestures="true" />

          EOF

          # ==================================================
          # MainActivity.java
          # ==================================================

          cat > app/src/main/java/com/example/applegameauto/MainActivity.java <<'EOF'
          package com.example.applegameauto;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private static final int REQUEST_CAPTURE = 1001;

              private TextView statusText;

              private int captureResultCode = -1;

              private Intent captureData = null;

              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              private final Runnable statusRunnable =
                      new Runnable() {

                          @Override
                          public void run() {

                              updateStatus();

                              handler.postDelayed(
                                      this,
                                      500
                              );
                          }
                      };

              @Override
              protected void onCreate(
                      Bundle savedInstanceState
              ) {

                  super.onCreate(savedInstanceState);

                  createUserInterface();

                  handler.post(statusRunnable);
              }

              private void createUserInterface() {

                  ScrollView scrollView =
                          new ScrollView(this);

                  LinearLayout layout =
                          new LinearLayout(this);

                  layout.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  layout.setPadding(
                          40,
                          50,
                          40,
                          40
                  );

                  TextView title =
                          new TextView(this);

                  title.setText(
                          "🍎 사과게임 자동 플레이"
                  );

                  title.setTextSize(25);

                  title.setTextColor(
                          Color.BLACK
                  );

                  title.setPadding(
                          0,
                          0,
                          0,
                          30
                  );

                  layout.addView(title);

                  TextView description =
                          new TextView(this);

                  description.setText(
                          "사용 순서\n\n" +
                          "1. 접근성 서비스를 켭니다.\n" +
                          "2. 접근성 테스트를 합니다.\n" +
                          "3. 화면 캡처 권한을 허용합니다.\n" +
                          "4. 사과게임을 실행합니다.\n" +
                          "5. 자동 플레이를 시작합니다.\n\n" +
                          "아래 상태창에서 현재 상태를 확인할 수 있습니다."
                  );

                  description.setTextSize(16);

                  description.setPadding(
                          0,
                          0,
                          0,
                          20
                  );

                  layout.addView(description);

                  Button accessibilityButton =
                          new Button(this);

                  accessibilityButton.setText(
                          "① 접근성 서비스 설정"
                  );

                  accessibilityButton.setOnClickListener(
                          v -> {

                              try {

                                  Intent intent =
                                          new Intent(
                                                  Settings.ACTION_ACCESSIBILITY_SETTINGS
                                          );

                                  startActivity(intent);

                              } catch (Exception e) {

                                  Toast.makeText(
                                          this,
                                          "접근성 설정을 열 수 없습니다.",
                                          Toast.LENGTH_LONG
                                  ).show();
                              }
                          }
                  );

                  layout.addView(
                          accessibilityButton
                  );

                  Button testButton =
                          new Button(this);

                  testButton.setText(
                          "② 접근성 테스트 드래그"
                  );

                  testButton.setOnClickListener(
                          v -> {

                              AppleAccessibilityService service =
                                      AppleAccessibilityService.instance;

                              if (service == null) {

                                  Toast.makeText(
                                          this,
                                          "접근성 서비스가 연결되지 않았습니다.",
                                          Toast.LENGTH_LONG
                                  ).show();

                                  return;
                              }

                              service.testSwipe();

                              Toast.makeText(
                                      this,
                                      "화면 중앙에서 테스트 드래그를 실행했습니다.",
                                      Toast.LENGTH_SHORT
                              ).show();
                          }
                  );

                  layout.addView(testButton);

                  Button captureButton =
                          new Button(this);

                  captureButton.setText(
                          "③ 화면 캡처 권한 허용"
                  );

                  captureButton.setOnClickListener(
                          v -> requestScreenCapture()
                  );

                  layout.addView(captureButton);

                  Button startButton =
                          new Button(this);

                  startButton.setText(
                          "④ 자동 플레이 시작"
                  );

                  startButton.setOnClickListener(
                          v -> startAutomaticPlay()
                  );

                  layout.addView(startButton);

                  Button stopButton =
                          new Button(this);

                  stopButton.setText(
                          "⑤ 자동 플레이 중지"
                  );

                  stopButton.setOnClickListener(
                          v -> {

                              GameCaptureService.stop(
                                      this
                              );

                              Toast.makeText(
                                      this,
                                      "자동 플레이를 중지했습니다.",
                                      Toast.LENGTH_SHORT
                              ).show();
                          }
                  );

                  layout.addView(stopButton);

                  statusText =
                          new TextView(this);

                  statusText.setTextSize(16);

                  statusText.setTextColor(
                          Color.DKGRAY
                  );

                  statusText.setGravity(
                          Gravity.START
                  );

                  statusText.setPadding(
                          20,
                          30,
                          20,
                          30
                  );

                  layout.addView(statusText);

                  scrollView.addView(layout);

                  setContentView(scrollView);
              }

              private void requestScreenCapture() {

                  MediaProjectionManager manager =
                          (MediaProjectionManager)
                                  getSystemService(
                                          Context.MEDIA_PROJECTION_SERVICE
                                  );

                  if (manager == null) {

                      Toast.makeText(
                              this,
                              "화면 캡처 기능을 사용할 수 없습니다.",
                              Toast.LENGTH_LONG
                      ).show();

                      return;
                  }

                  try {

                      Intent intent =
                              manager.createScreenCaptureIntent();

                      startActivityForResult(
                              intent,
                              REQUEST_CAPTURE
                      );

                  } catch (Exception e) {

                      Toast.makeText(
                              this,
                              "화면 캡처 권한 요청 실패",
                              Toast.LENGTH_LONG
                      ).show();
                  }
              }

              private void startAutomaticPlay() {

                  if (
                          AppleAccessibilityService.instance
                                  == null
                  ) {

                      Toast.makeText(
                              this,
                              "먼저 접근성 서비스를 켜주세요.",
                              Toast.LENGTH_LONG
                      ).show();

                      return;
                  }

                  if (
                          captureResultCode == -1
                                  || captureData == null
                  ) {

                      Toast.makeText(
                              this,
                              "먼저 화면 캡처 권한을 허용해주세요.",
                              Toast.LENGTH_LONG
                      ).show();

                      return;
                  }

                  Intent serviceIntent =
                          new Intent(
                                  this,
                                  GameCaptureService.class
                          );

                  serviceIntent.putExtra(
                          GameCaptureService.EXTRA_RESULT_CODE,
                          captureResultCode
                  );

                  serviceIntent.putExtra(
                          GameCaptureService.EXTRA_DATA,
                          captureData
                  );

                  try {

                      if (
                              Build.VERSION.SDK_INT
                                      >= Build.VERSION_CODES.O
                      ) {

                          startForegroundService(
                                  serviceIntent
                          );

                      } else {

                          startService(
                                  serviceIntent
                          );
                      }

                      /*
                       * MediaProjection 권한은
                       * 한 세션에서 한 번만 사용한다.
                       */
                      captureResultCode = -1;

                      captureData = null;

                      Toast.makeText(
                              this,
                              "자동 플레이를 시작했습니다.",
                              Toast.LENGTH_SHORT
                      ).show();

                  } catch (Exception e) {

                      Toast.makeText(
                              this,
                              "자동 플레이 시작 실패: "
                                      + e.getMessage(),
                              Toast.LENGTH_LONG
                      ).show();
                  }
              }

              @SuppressWarnings("deprecation")
              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data
              ) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );

                  if (
                          requestCode == REQUEST_CAPTURE
                                  && resultCode == RESULT_OK
                                  && data != null
                  ) {

                      captureResultCode =
                              resultCode;

                      captureData =
                              data;

                      Toast.makeText(
                              this,
                              "화면 캡처 권한이 준비되었습니다.",
                              Toast.LENGTH_SHORT
                      ).show();

                  } else if (
                          requestCode == REQUEST_CAPTURE
                  ) {

                      captureResultCode = -1;

                      captureData = null;

                      Toast.makeText(
                              this,
                              "화면 캡처 권한이 취소되었습니다.",
                              Toast.LENGTH_SHORT
                      ).show();
                  }
              }

              private void updateStatus() {

                  if (statusText == null) {
                      return;
                  }

                  android.content.SharedPreferences prefs =
                          getSharedPreferences(
                                  "apple_game_status",
                                  MODE_PRIVATE
                          );

                  boolean accessibility =
                          AppleAccessibilityService.instance
                                  != null;

                  boolean running =
                          prefs.getBoolean(
                                  "running",
                                  false
                          );

                  String capture =
                          prefs.getString(
                                  "capture",
                                  "대기"
                          );

                  int ocr =
                          prefs.getInt(
                                  "ocr_count",
                                  0
                          );

                  String move =
                          prefs.getString(
                                  "move",
                                  "대기"
                          );

                  String lastMove =
                          prefs.getString(
                                  "last_move",
                                  "-"
                          );

                  String gesture =
                          prefs.getString(
                                  "gesture",
                                  "대기"
                          );

                  String error =
                          prefs.getString(
                                  "error",
                                  ""
                          );

                  String text =
                          "━━━━━━━━━━━━━━━━━━\n" +
                          "현재 상태\n\n" +

                          "자동 플레이: "
                                  + (
                                  running
                                          ? "🟢 실행 중"
                                          : "⚪ 대기"
                          )
                                  + "\n\n" +

                          "접근성 서비스: "
                                  + (
                                  accessibility
                                          ? "✅ 연결됨"
                                          : "❌ 연결 안 됨"
                          )
                                  + "\n\n" +

                          "화면 캡처: "
                                  + capture
                                  + "\n\n" +

                          "인식된 숫자: "
                                  + ocr
                                  + "개\n\n" +

                          "합계 10: "
                                  + move
                                  + "\n\n" +

                          "마지막 드래그: "
                                  + lastMove
                                  + "\n\n" +

                          "드래그 결과: "
                                  + gesture
                                  + "\n\n" +

                          "오류: "
                                  + (
                                  error.isEmpty()
                                          ? "없음"
                                          : error
                          )
                                  + "\n" +

                          "━━━━━━━━━━━━━━━━━━";

                  statusText.setText(text);
              }

              @Override
              protected void onDestroy() {

                  handler.removeCallbacks(
                          statusRunnable
                  );

                  super.onDestroy();
              }
          }
          EOF

          # ==================================================
          # AppleAccessibilityService.java
          # ==================================================

          cat > app/src/main/java/com/example/applegameauto/AppleAccessibilityService.java <<'EOF'
          package com.example.applegameauto;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.os.Build;
          import android.view.accessibility.AccessibilityEvent;

          public class AppleAccessibilityService
                  extends AccessibilityService {

              public static volatile
              AppleAccessibilityService instance = null;

              @Override
              protected void onServiceConnected() {

                  super.onServiceConnected();

                  instance = this;

                  saveStatus(
                          "accessibility",
                          "connected"
                  );
              }

              @Override
              public void onAccessibilityEvent(
                      AccessibilityEvent event
              ) {
                  // 이벤트를 사용할 필요가 없다.
              }

              @Override
              public void onInterrupt() {
                  // 아무 작업도 하지 않는다.
              }

              @Override
              public void onDestroy() {

                  if (instance == this) {
                      instance = null;
                  }

                  super.onDestroy();
              }

              public void swipe(
                      float startX,
                      float startY,
                      float endX,
                      float endY,
                      long duration,
                      final GestureCallback callback
              ) {

                  if (
                          Build.VERSION.SDK_INT
                                  < Build.VERSION_CODES.N
                  ) {

                      if (callback != null) {
                          callback.onResult(false);
                      }

                      return;
                  }

                  Path path =
                          new Path();

                  path.moveTo(
                          startX,
                          startY
                  );

                  path.lineTo(
                          endX,
                          endY
                  );

                  GestureDescription.StrokeDescription stroke =
                          new GestureDescription.StrokeDescription(
                                  path,
                                  0,
                                  duration
                          );

                  GestureDescription gesture =
                          new GestureDescription.Builder()
                                  .addStroke(stroke)
                                  .build();

                  boolean dispatched =
                          dispatchGesture(
                                  gesture,
                                  new GestureResultCallback() {

                                      @Override
                                      public void onCompleted(
                                              GestureDescription gestureDescription
                                      ) {

                                          saveStatus(
                                                  "gesture",
                                                  "✅ 성공"
                                          );

                                          if (callback != null) {
                                              callback.onResult(true);
                                          }
                                      }

                                      @Override
                                      public void onCancelled(
                                              GestureDescription gestureDescription
                                      ) {

                                          saveStatus(
                                                  "gesture",
                                                  "❌ 취소됨"
                                          );

                                          if (callback != null) {
                                              callback.onResult(false);
                                          }
                                      }
                                  },
                                  null
                          );

                  if (!dispatched) {

                      saveStatus(
                              "gesture",
                              "❌ dispatch 실패"
                      );

                      if (callback != null) {
                          callback.onResult(false);
                      }
                  }
              }

              public void testSwipe() {

                  android.util.DisplayMetrics metrics =
                          getResources().getDisplayMetrics();

                  float centerX =
                          metrics.widthPixels / 2f;

                  float centerY =
                          metrics.heightPixels / 2f;

                  swipe(
                          centerX - 200,
                          centerY,
                          centerX + 200,
                          centerY,
                          700,
                          null
                  );
              }

              private void saveStatus(
                      String key,
                      String value
              ) {

                  getSharedPreferences(
                          "apple_game_status",
                          MODE_PRIVATE
                  )
                          .edit()
                          .putString(
                                  key,
                                  value
                          )
                          .apply();
              }

              public interface GestureCallback {

                  void onResult(boolean success);
              }
          }
          EOF

          # ==================================================
          # GameCaptureService.java
          # ==================================================

          cat > app/src/main/java/com/example/applegameauto/GameCaptureService.java <<'EOF'
          package com.example.applegameauto;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.PixelFormat;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;

          import androidx.core.app.NotificationCompat;

          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.text.TextRecognition;
          import com.google.mlkit.vision.text.TextRecognizer;
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions;

          import java.util.ArrayList;
          import java.util.List;

          public class GameCaptureService
                  extends Service {

              public static final String EXTRA_RESULT_CODE =
                      "capture_result_code";

              public static final String EXTRA_DATA =
                      "capture_data";

              private static final String CHANNEL_ID =
                      "apple_game_auto";

              private static final int NOTIFICATION_ID =
                      100;

              /*
               * 게임판 기준 좌표
               *
               * 기준 화면:
               * 1536 x 960
               *
               * 18열 x 9행
               */
              private static final int ROWS = 9;

              private static final int COLS = 18;

              private static final float REF_WIDTH =
                      1536f;

              private static final float REF_HEIGHT =
                      960f;

              private static final float FIRST_X =
                      96f;

              private static final float FIRST_Y =
                      200f;

              private static final float X_GAP =
                      78.3f;

              private static final float Y_GAP =
                      78.3f;

              private static final float TOLERANCE =
                      42f;

              private static final float BOARD_MARGIN =
                      60f;

              private final Handler handler =
                      new Handler(
                              Looper.getMainLooper()
                      );

              private MediaProjection projection;

              private VirtualDisplay virtualDisplay;

              private ImageReader imageReader;

              private TextRecognizer recognizer;

              private boolean processing =
                      false;

              private boolean running =
                      false;

              private int screenWidth;

              private int screenHeight;

              private int density;

              @Override
              public void onCreate() {

                  super.onCreate();

                  createNotificationChannel();

                  Notification notification =
                          new NotificationCompat.Builder(
                                  this,
                                  CHANNEL_ID
                          )
                                  .setContentTitle(
                                          "사과게임 자동 플레이"
                                  )
                                  .setContentText(
                                          "게임 화면을 분석하고 있습니다."
                                  )
                                  .setSmallIcon(
                                          android.R.drawable.ic_media_play
                                  )
                                  .setOngoing(true)
                                  .build();

                  if (
                          Build.VERSION.SDK_INT
                                  >= Build.VERSION_CODES.Q
                  ) {

                      startForeground(
                              NOTIFICATION_ID,
                              notification,
                              ServiceInfo
                                      .FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION
                      );

                  } else {

                      startForeground(
                              NOTIFICATION_ID,
                              notification
                      );
                  }

                  recognizer =
                          TextRecognition.getClient(
                                  TextRecognizerOptions.DEFAULT_OPTIONS
                          );
              }

              @Override
              public int onStartCommand(
                      Intent intent,
                      int flags,
                      int startId
              ) {

                  if (running) {
                      return START_NOT_STICKY;
                  }

                  if (intent == null) {

                      setError(
                              "서비스 Intent가 없습니다."
                      );

                      stopSelf();

                      return START_NOT_STICKY;
                  }

                  int resultCode =
                          intent.getIntExtra(
                                  EXTRA_RESULT_CODE,
                                  -1
                          );

                  Intent data;

                  if (
                          Build.VERSION.SDK_INT
                                  >= Build.VERSION_CODES.TIRAMISU
                  ) {

                      data =
                              intent.getParcelableExtra(
                                      EXTRA_DATA,
                                      Intent.class
                              );

                  } else {

                      @SuppressWarnings("deprecation")
                      Intent oldData =
                              intent.getParcelableExtra(
                                      EXTRA_DATA
                              );

                      data = oldData;
                  }

                  if (
                          resultCode == -1
                                  || data == null
                  ) {

                      setError(
                              "MediaProjection 권한 데이터가 없습니다."
                      );

                      stopSelf();

                      return START_NOT_STICKY;
                  }

                  running = true;

                  saveRunning(true);

                  startCapture(
                          resultCode,
                          data
                  );

                  return START_NOT_STICKY;
              }

              private void startCapture(
                      int resultCode,
                      Intent data
              ) {

                  try {

                      MediaProjectionManager manager =
                              (MediaProjectionManager)
                                      getSystemService(
                                              Context.MEDIA_PROJECTION_SERVICE
                                      );

                      if (manager == null) {

                          setError(
                                  "MediaProjectionManager를 찾을 수 없습니다."
                          );

                          stopSelf();

                          return;
                      }

                      projection =
                              manager.getMediaProjection(
                                      resultCode,
                                      data
                              );

                      if (projection == null) {

                          setError(
                                  "MediaProjection 생성 실패"
                          );

                          stopSelf();

                          return;
                      }

                      android.util.DisplayMetrics metrics =
                              getResources()
                                      .getDisplayMetrics();

                      screenWidth =
                              metrics.widthPixels;

                      screenHeight =
                              metrics.heightPixels;

                      density =
                              metrics.densityDpi;

                      imageReader =
                              ImageReader.newInstance(
                                      screenWidth,
                                      screenHeight,
                                      PixelFormat.RGBA_8888,
                                      2
                              );

                      projection.registerCallback(
                              new MediaProjection.Callback() {

                                  @Override
                                  public void onStop() {

                                      handler.post(
                                              () -> {

                                                  saveCapture(
                                                          "중지됨"
                                                  );

                                                  stopSelf();
                                              }
                                      );
                                  }
                              },
                              handler
                      );

                      virtualDisplay =
                              projection.createVirtualDisplay(
                                      "AppleGameCapture",
                                      screenWidth,
                                      screenHeight,
                                      density,
                                      DisplayManager
                                              .VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                                      imageReader.getSurface(),
                                      null,
                                      handler
                              );

                      imageReader.setOnImageAvailableListener(
                              reader -> {

                                  if (processing) {
                                      return;
                                  }

                                  processing = true;

                                  Image image = null;

                                  try {

                                      image =
                                              reader.acquireLatestImage();

                                  } catch (Exception e) {

                                      setError(
                                              "화면 이미지 획득 실패: "
                                                      + e.getMessage()
                                      );

                                      processing = false;
                                  }

                                  if (image != null) {

                                      processImage(
                                              image
                                      );
                                  } else {

                                      processing = false;
                                  }

                              },
                              handler
                      );

                      saveCapture(
                              "✅ 연결됨"
                      );

                      clearError();

                  } catch (SecurityException e) {

                      setError(
                              "MediaProjection 보안 오류: "
                                      + e.getMessage()
                      );

                      stopSelf();

                  } catch (Exception e) {

                      setError(
                              "캡처 시작 오류: "
                                      + e.getMessage()
                      );

                      stopSelf();
                  }
              }

              private void processImage(
                      Image image
              ) {

                  Bitmap bitmap = null;

                  try {

                      bitmap =
                              imageToBitmap(
                                      image
                              );

                  } catch (Exception e) {

                      setError(
                              "이미지 변환 실패: "
                                      + e.getMessage()
                      );

                  } finally {

                      try {
                          image.close();
                      } catch (Exception ignored) {
                      }
                  }

                  if (bitmap == null) {

                      processing = false;

                      return;
                  }

                  recognizeBoard(
                          bitmap
                  );
              }

              private Bitmap imageToBitmap(
                      Image image
              ) {

                  Image.Plane[] planes =
                          image.getPlanes();

                  if (
                          planes == null
                                  || planes.length == 0
                  ) {
                      return null;
                  }

                  Image.Plane plane =
                          planes[0];

                  java.nio.ByteBuffer buffer =
                          plane.getBuffer();

                  int pixelStride =
                          plane.getPixelStride();

                  int rowStride =
                          plane.getRowStride();

                  int rowPadding =
                          rowStride -
                                  pixelStride *
                                          image.getWidth();

                  int bitmapWidth =
                          image.getWidth()
                                  + rowPadding /
                                  pixelStride;

                  Bitmap bitmap =
                          Bitmap.createBitmap(
                                  bitmapWidth,
                                  image.getHeight(),
                                  Bitmap.Config.ARGB_8888
                          );

                  buffer.rewind();

                  bitmap.copyPixelsFromBuffer(
                          buffer
                  );

                  return Bitmap.createBitmap(
                          bitmap,
                          0,
                          0,
                          image.getWidth(),
                          image.getHeight()
                  );
              }

              private void recognizeBoard(
                      Bitmap bitmap
              ) {

                  float scaleX =
                          bitmap.getWidth()
                                  / REF_WIDTH;

                  float scaleY =
                          bitmap.getHeight()
                                  / REF_HEIGHT;

                  int left =
                          Math.max(
                                  0,
                                  Math.round(
                                          (
                                                  FIRST_X -
                                                          BOARD_MARGIN
                                          ) * scaleX
                                  )
                          );

                  int top =
                          Math.max(
                                  0,
                                  Math.round(
                                          (
                                                  FIRST_Y -
                                                          BOARD_MARGIN
                                          ) * scaleY
                                  )
                          );

                  int right =
                          Math.min(
                                  bitmap.getWidth(),
                                  Math.round(
                                          (
                                                  FIRST_X +
                                                          (
                                                                  COLS - 1
                                                          ) *
                                                          X_GAP +
                                                          BOARD_MARGIN
                                          ) * scaleX
                                  )
                          );

                  int bottom =
                          Math.min(
                                  bitmap.getHeight(),
                                  Math.round(
                                          (
                                                  FIRST_Y +
                                                          (
                                                                  ROWS - 1
                                                          ) *
                                                          Y_GAP +
                                                          BOARD_MARGIN
                                          ) * scaleY
                                  )
                          );

                  if (
                          right <= left
                                  || bottom <= top
                  ) {

                      setError(
                              "게임판 영역 계산 실패"
                      );

                      processing = false;

                      return;
                  }

                  Bitmap crop =
                          Bitmap.createBitmap(
                                  bitmap,
                                  left,
                                  top,
                                  right - left,
                                  bottom - top
                          );

                  InputImage inputImage =
                          InputImage.fromBitmap(
                                  crop,
                                  0
                          );

                  recognizer
                          .process(inputImage)
                          .addOnSuccessListener(
                                  result -> {

                                      analyzeOcr(
                                              result,
                                              left,
                                              top,
                                              scaleX,
                                              scaleY
                                      );
                                  }
                          )
                          .addOnFailureListener(
                                  e -> {

                                      setError(
                                              "OCR 실패: "
                                                      + e.getMessage()
                                      );

                                      processing = false;
                                  }
                          );
              }

              private void analyzeOcr(
                      com.google.mlkit.vision.text.Text result,
                      int cropLeft,
                      int cropTop,
                      float scaleX,
                      float scaleY
              ) {

                  int[][] board =
                          new int[ROWS][COLS];

                  int recognized =
                          0;

                  for (
                          com.google.mlkit.vision.text.Text.TextBlock block
                                  : result.getTextBlocks()
                  ) {

                      for (
                              com.google.mlkit.vision.text.Text.Line line
                                      : block.getLines()
                      ) {

                          for (
                                  com.google.mlkit.vision.text.Text.Element element
                                          : line.getElements()
                          ) {

                              String text =
                                      element.getText()
                                              .trim();

                              if (
                                      text.length() != 1
                                              || text.charAt(0) < '1'
                                              || text.charAt(0) > '9'
                              ) {
                                  continue;
                              }

                              android.graphics.Rect box =
                                      element.getBoundingBox();

                              if (box == null) {
                                  continue;
                              }

                              float centerX =
                                      (
                                              box.left +
                                                      box.right
                                      ) / 2f;

                              float centerY =
                                      (
                                              box.top +
                                                      box.bottom
                                      ) / 2f;

                              centerX += cropLeft;

                              centerY += cropTop;

                              float refX =
                                      centerX /
                                              scaleX;

                              float refY =
                                      centerY /
                                              scaleY;

                              int col =
                                      Math.round(
                                              (
                                                      refX -
                                                              FIRST_X
                                              ) /
                                                      X_GAP
                                      );

                              int row =
                                      Math.round(
                                              (
                                                      refY -
                                                              FIRST_Y
                                              ) /
                                                      Y_GAP
                                      );

                              if (
                                      row < 0
                                              || row >= ROWS
                                              || col < 0
                                              || col >= COLS
                              ) {
                                  continue;
                              }

                              float expectedX =
                                      FIRST_X +
                                              col *
                                                      X_GAP;

                              float expectedY =
                                      FIRST_Y +
                                              row *
                                                      Y_GAP;

                              float dx =
                                      Math.abs(
                                              refX -
                                                      expectedX
                                      );

                              float dy =
                                      Math.abs(
                                              refY -
                                                      expectedY
                                      );

                              if (
                                      dx <= TOLERANCE
                                              && dy <= TOLERANCE
                              ) {

                                  if (
                                          board[row][col] == 0
                                  ) {

                                      board[row][col] =
                                              Integer.parseInt(
                                                      text
                                              );

                                      recognized++;
                                  }
                              }
                          }
                      }
                  }

                  saveOcrCount(
                          recognized
                  );

                  if (recognized == 0) {

                      setMoveStatus(
                              "숫자를 찾지 못함"
                      );

                      processing = false;

                      return;
                  }

                  Move move =
                          findSumTen(
                                  board
                          );

                  if (move == null) {

                      setMoveStatus(
                              "합계 10 없음"
                      );

                      processing = false;

                      return;
                  }

                  setMoveStatus(
                          "✅ 발견"
                  );

                  String moveText =
                          "("
                                  + (move.r1 + 1)
                                  + ","
                                  + (move.c1 + 1)
                                  + ") → ("
                                  + (move.r2 + 1)
                                  + ","
                                  + (move.c2 + 1)
                                  + ")";

                  saveLastMove(
                          moveText
                  );

                  performMove(
                          move
                  );
              }

              private Move findSumTen(
                      int[][] board
              ) {

                  int[][] prefix =
                          new int[
                                  ROWS + 1
                          ][
                                  COLS + 1
                          ];

                  for (
                          int r = 0;
                          r < ROWS;
                          r++
                  ) {

                      for (
                              int c = 0;
                              c < COLS;
                              c++
                      ) {

                          prefix[r + 1][c + 1] =
                                  board[r][c]
                                          + prefix[r][c + 1]
                                          + prefix[r + 1][c]
                                          - prefix[r][c];
                      }
                  }

                  Move best = null;

                  int bestArea =
                          Integer.MAX_VALUE;

                  for (
                          int r1 = 0;
                          r1 < ROWS;
                          r1++
                  ) {

                      for (
                              int c1 = 0;
                              c1 < COLS;
                              c1++
                      ) {

                          for (
                                  int r2 = r1;
                                  r2 < ROWS;
                                  r2++
                          ) {

                              for (
                                      int c2 = c1;
                                      c2 < COLS;
                                      c2++
                              ) {

                                  int sum =
                                          prefix[r2 + 1][c2 + 1]
                                                  - prefix[r1][c2 + 1]
                                                  - prefix[r2 + 1][c1]
                                                  + prefix[r1][c1];

                                  if (sum != 10) {
                                      continue;
                                  }

                                  int area =
                                          (
                                                  r2 - r1 + 1
                                          ) *
                                                  (
                                                          c2 - c1 + 1
                                                  );

                                  if (
                                          area < bestArea
                                  ) {

                                      bestArea =
                                              area;

                                      best =
                                              new Move(
                                                      r1,
                                                      c1,
                                                      r2,
                                                      c2
                                              );
                                  }
                              }
                          }
                      }
                  }

                  return best;
              }

              private void performMove(
                      Move move
              ) {

                  float scaleX =
                          screenWidth /
                                  REF_WIDTH;

                  float scaleY =
                          screenHeight /
                                  REF_HEIGHT;

                  float startX =
                          (
                                  FIRST_X +
                                          move.c1 *
                                                  X_GAP
                          ) * scaleX;

                  float startY =
                          (
                                  FIRST_Y +
                                          move.r1 *
                                                  Y_GAP
                          ) * scaleY;

                  float endX =
                          (
                                  FIRST_X +
                                          move.c2 *
                                                  X_GAP
                          ) * scaleX;

                  float endY =
                          (
                                  FIRST_Y +
                                          move.r2 *
                                                  Y_GAP
                          ) * scaleY;

                  AppleAccessibilityService service =
                          AppleAccessibilityService.instance;

                  if (service == null) {

                      setError(
                              "접근성 서비스가 연결되지 않았습니다."
                      );

                      processing = false;

                      return;
                  }

                  service.swipe(
                          startX,
                          startY,
                          endX,
                          endY,
                          220,
                          success -> {

                              if (success) {

                                  saveGesture(
                                          "✅ 성공"
                                  );

                              } else {

                                  saveGesture(
                                          "❌ 실패"
                                  );
                              }

                              /*
                               * 게임판이 바뀔 시간을 준 뒤
                               * 다시 OCR한다.
                               */
                              handler.postDelayed(
                                      () -> {

                                          processing =
                                                  false;

                                      },
                                      650
                              );
                          }
                  );
              }

              private void createNotificationChannel() {

                  if (
                          Build.VERSION.SDK_INT
                                  < Build.VERSION_CODES.O
                  ) {
                      return;
                  }

                  NotificationChannel channel =
                          new NotificationChannel(
                                  CHANNEL_ID,
                                  "사과게임 자동 플레이",
                                  NotificationManager
                                          .IMPORTANCE_LOW
                          );

                  NotificationManager manager =
                          (NotificationManager)
                                  getSystemService(
                                          NOTIFICATION_SERVICE
                                  );

                  if (manager != null) {

                      manager.createNotificationChannel(
                              channel
                      );
                  }
              }

              private android.content.SharedPreferences prefs() {

                  return getSharedPreferences(
                          "apple_game_status",
                          MODE_PRIVATE
                  );
              }

              private void saveRunning(
                      boolean value
              ) {

                  prefs()
                          .edit()
                          .putBoolean(
                                  "running",
                                  value
                          )
                          .apply();
              }

              private void saveCapture(
                      String value
              ) {

                  prefs()
                          .edit()
                          .putString(
                                  "capture",
                                  value
                          )
                          .apply();
              }

              private void saveOcrCount(
                      int value
              ) {

                  prefs()
                          .edit()
                          .putInt(
                                  "ocr_count",
                                  value
                          )
                          .apply();
              }

              private void setMoveStatus(
                      String value
              ) {

                  prefs()
                          .edit()
                          .putString(
                                  "move",
                                  value
                          )
                          .apply();
              }

              private void saveLastMove(
                      String value
              ) {

                  prefs()
                          .edit()
                          .putString(
                                  "last_move",
                                  value
                          )
                          .apply();
              }

              private void saveGesture(
                      String value
              ) {

                  prefs()
                          .edit()
                          .putString(
                                  "gesture",
                                  value
                          )
                          .apply();
              }

              private void setError(
                      String value
              ) {

                  prefs()
                          .edit()
                          .putString(
                                  "error",
                                  value
                          )
                          .apply();
              }

              private void clearError() {

                  prefs()
                          .edit()
                          .putString(
                                  "error",
                                  ""
                          )
                          .apply();
              }

              @Override
              public void onDestroy() {

                  running = false;

                  saveRunning(false);

                  processing = false;

                  handler.removeCallbacksAndMessages(
                          null
                  );

                  if (imageReader != null) {

                      imageReader.setOnImageAvailableListener(
                              null,
                              null
                      );

                      imageReader.close();

                      imageReader = null;
                  }

                  if (virtualDisplay != null) {

                      virtualDisplay.release();

                      virtualDisplay = null;
                  }

                  if (projection != null) {

                      try {
                          projection.stop();
                      } catch (Exception ignored) {
                      }

                      projection = null;
                  }

                  if (recognizer != null) {

                      recognizer.close();

                      recognizer = null;
                  }

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(
                      Intent intent
              ) {

                  return null;
              }

              private static class Move {

                  final int r1;
                  final int c1;
                  final int r2;
                  final int c2;

                  Move(
                          int r1,
                          int c1,
                          int r2,
                          int c2
                  ) {

                      this.r1 = r1;
                      this.c1 = c1;
                      this.r2 = r2;
                      this.c2 = c2;
                  }
              }
          }
          EOF

      # ------------------------------------------------------
      # Check Gradle
      # ------------------------------------------------------

      - name: Check Gradle
        run: |
          gradle --version
          gradle tasks --no-daemon

      # ------------------------------------------------------
      # Clean
      # ------------------------------------------------------

      - name: Clean
        run: |
          gradle clean \
            --no-daemon \
            --stacktrace

      # ------------------------------------------------------
      # Build
      # ------------------------------------------------------

      - name: Build APK
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      # ------------------------------------------------------
      # Upload APK
      # ------------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:
          name: AppleGameAuto-v3-debug

          path:
            app/build/outputs/apk/debug/app-debug.apk

          if-no-files-found: error
