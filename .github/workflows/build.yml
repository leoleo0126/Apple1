name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. 저장소 가져오기
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. Java 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. Gradle 8.10.2
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # ============================================================
      # 4. Android 프로젝트 생성
      # ============================================================

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/example/applegameauto
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values


          # --------------------------------------------------------
          # settings.gradle
          # --------------------------------------------------------

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AppleGameAuto"

          include(":app")
          EOF


          # --------------------------------------------------------
          # Root build.gradle
          # --------------------------------------------------------

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF


          # --------------------------------------------------------
          # gradle.properties
          # --------------------------------------------------------

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF


          # --------------------------------------------------------
          # app/build.gradle
          # --------------------------------------------------------

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.applegameauto'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.applegameauto'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false

                      proguardFiles(
                          getDefaultProguardFile(
                              'proguard-android-optimize.txt'
                          ),
                          'proguard-rules.pro'
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'com.google.mlkit:text-recognition:16.0.1'
          }
          EOF


          # --------------------------------------------------------
          # ProGuard
          # --------------------------------------------------------

          cat > app/proguard-rules.pro <<'EOF'
          # No custom ProGuard rules.
          EOF


          # --------------------------------------------------------
          # AndroidManifest.xml
          # --------------------------------------------------------

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />


              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">


                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>


                  <service
                      android:name=".AppleAccessibilityService"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">

                      <intent-filter>

                          <action
                              android:name="android.accessibilityservice.AccessibilityService" />

                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>


                  <service
                      android:name=".GameCaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

              </application>

          </manifest>
          EOF


          # --------------------------------------------------------
          # strings.xml
          # --------------------------------------------------------

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">사과게임 자동 플레이</string>

              <string name="accessibility_service_description">
                  사과게임의 숫자를 선택하기 위해 화면을 드래그합니다.
              </string>

          </resources>
          EOF


          # --------------------------------------------------------
          # themes.xml
          # --------------------------------------------------------

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="Theme.Material3.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowLightStatusBar">true</item>

                  <item name="android:statusBarColor">#FFFFFF</item>

                  <item name="android:navigationBarColor">#FFFFFF</item>

              </style>

          </resources>
          EOF


          # --------------------------------------------------------
          # 접근성 서비스 설정
          # --------------------------------------------------------

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"

              android:description="@string/accessibility_service_description"

              android:accessibilityEventTypes="typeAllMask"

              android:accessibilityFeedbackType="feedbackGeneric"

              android:notificationTimeout="100"

              android:canRetrieveWindowContent="false"

              android:canPerformGestures="true" />

          EOF


          # ========================================================
          # MainActivity.kt
          # ========================================================

          cat > app/src/main/java/com/example/applegameauto/MainActivity.kt <<'EOF'
          package com.example.applegameauto

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              companion object {
                  private const val REQUEST_CAPTURE = 1001
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this)

                  layout.orientation = LinearLayout.VERTICAL

                  layout.setPadding(
                      40,
                      60,
                      40,
                      40
                  )


                  val title = TextView(this)

                  title.text = "🍎 사과게임 자동 플레이"

                  title.textSize = 25f

                  title.setPadding(
                      0,
                      0,
                      0,
                      30
                  )


                  val info = TextView(this)

                  info.text = """
                      사용 방법

                      1. 접근성 서비스 설정
                      2. 화면 캡처 권한 허용
                      3. 사과게임 실행
                      4. 자동 플레이 시작

                      화면의 숫자를 인식하여
                      합이 10이 되는 영역을
                      자동으로 드래그합니다.
                  """.trimIndent()

                  info.textSize = 17f

                  info.setPadding(
                      0,
                      0,
                      0,
                      30
                  )


                  val accessibilityButton = Button(this)

                  accessibilityButton.text =
                      "① 접근성 서비스 설정"

                  accessibilityButton.setOnClickListener {

                      try {

                          startActivity(
                              Intent(
                                  Settings.ACTION_ACCESSIBILITY_SETTINGS
                              )
                          )

                      } catch (e: Exception) {

                          Toast.makeText(
                              this,
                              "접근성 설정을 열 수 없습니다.",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                  }


                  val captureButton = Button(this)

                  captureButton.text =
                      "② 화면 캡처 권한 허용"

                  captureButton.setOnClickListener {

                      requestScreenCapture()
                  }


                  val startButton = Button(this)

                  startButton.text =
                      "③ 자동 플레이 시작"

                  startButton.setOnClickListener {

                      if (
                          !AppleAccessibilityService.isEnabled
                      ) {

                          Toast.makeText(
                              this,
                              "먼저 접근성 서비스를 켜주세요.",
                              Toast.LENGTH_LONG
                          ).show()

                          return@setOnClickListener
                      }


                      if (
                          !GameCaptureService.hasPermission
                      ) {

                          Toast.makeText(
                              this,
                              "먼저 화면 캡처 권한을 허용해주세요.",
                              Toast.LENGTH_LONG
                          ).show()

                          return@setOnClickListener
                      }


                      GameCaptureService.start(this)

                      Toast.makeText(
                          this,
                          "자동 플레이를 시작했습니다.",
                          Toast.LENGTH_SHORT
                      ).show()
                  }


                  val stopButton = Button(this)

                  stopButton.text =
                      "④ 자동 플레이 중지"

                  stopButton.setOnClickListener {

                      GameCaptureService.stop(this)

                      Toast.makeText(
                          this,
                          "자동 플레이를 중지했습니다.",
                          Toast.LENGTH_SHORT
                      ).show()
                  }


                  layout.addView(title)
                  layout.addView(info)
                  layout.addView(accessibilityButton)
                  layout.addView(captureButton)
                  layout.addView(startButton)
                  layout.addView(stopButton)

                  setContentView(layout)
              }


              private fun requestScreenCapture() {

                  val manager =
                      getSystemService(
                          Context.MEDIA_PROJECTION_SERVICE
                      ) as MediaProjectionManager


                  startActivityForResult(
                      manager.createScreenCaptureIntent(),
                      REQUEST_CAPTURE
                  )
              }


              @Suppress("DEPRECATION")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  )


                  if (
                      requestCode == REQUEST_CAPTURE &&
                      resultCode == RESULT_OK &&
                      data != null
                  ) {

                      GameCaptureService.savePermission(
                          resultCode,
                          data
                      )


                      Toast.makeText(
                          this,
                          "화면 캡처 권한이 저장되었습니다.",
                          Toast.LENGTH_SHORT
                      ).show()
                  }
              }
          }
          EOF


          # ========================================================
          # AppleAccessibilityService.kt
          # ========================================================

          cat > app/src/main/java/com/example/applegameauto/AppleAccessibilityService.kt <<'EOF'
          package com.example.applegameauto

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.os.Build
          import android.view.accessibility.AccessibilityEvent

          class AppleAccessibilityService :
              AccessibilityService() {

              companion object {

                  @Volatile
                  var instance:
                      AppleAccessibilityService? = null

                  @Volatile
                  var isEnabled: Boolean = false
              }


              override fun onServiceConnected() {

                  super.onServiceConnected()

                  instance = this

                  isEnabled = true
              }


              override fun onAccessibilityEvent(
                  event: AccessibilityEvent?
              ) {
              }


              override fun onInterrupt() {
              }


              override fun onDestroy() {

                  isEnabled = false

                  if (instance === this) {
                      instance = null
                  }

                  super.onDestroy()
              }


              fun swipe(
                  startX: Float,
                  startY: Float,
                  endX: Float,
                  endY: Float,
                  duration: Long = 180L
              ) {

                  if (
                      Build.VERSION.SDK_INT <
                      Build.VERSION_CODES.N
                  ) {
                      return
                  }


                  val path = Path()

                  path.moveTo(
                      startX,
                      startY
                  )

                  path.lineTo(
                      endX,
                      endY
                  )


                  val stroke =
                      GestureDescription.StrokeDescription(
                          path,
                          0L,
                          duration
                      )


                  val gesture =
                      GestureDescription.Builder()
                          .addStroke(stroke)
                          .build()


                  dispatchGesture(
                      gesture,
                      null,
                      null
                  )
              }
          }
          EOF


          # ========================================================
          # GameCaptureService.kt
          # ========================================================

          cat > app/src/main/java/com/example/applegameauto/GameCaptureService.kt <<'EOF'
          package com.example.applegameauto

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.Image
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import androidx.core.app.NotificationCompat
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import kotlin.math.abs

          class GameCaptureService : Service() {

              companion object {

                  private const val CHANNEL_ID =
                      "apple_game_auto"

                  private const val NOTIFICATION_ID =
                      100


                  private const val ROWS =
                      9

                  private const val COLS =
                      18


                  private const val REF_WIDTH =
                      1536f

                  private const val REF_HEIGHT =
                      960f


                  private const val FIRST_X =
                      96f

                  private const val FIRST_Y =
                      200f


                  private const val X_GAP =
                      78.3f

                  private const val Y_GAP =
                      78.3f


                  private const val CELL_TOLERANCE =
                      35f


                  private var permissionResultCode =
                      0

                  private var permissionData:
                      Intent? = null


                  @Volatile
                  var hasPermission =
                      false
                      private set


                  fun savePermission(
                      resultCode: Int,
                      data: Intent
                  ) {

                      permissionResultCode =
                          resultCode

                      permissionData =
                          data

                      hasPermission =
                          true
                  }


                  fun start(
                      context: Context
                  ) {

                      val intent =
                          Intent(
                              context,
                              GameCaptureService::class.java
                          )


                      if (
                          Build.VERSION.SDK_INT >=
                          Build.VERSION_CODES.O
                      ) {

                          context.startForegroundService(
                              intent
                          )

                      } else {

                          context.startService(
                              intent
                          )
                      }
                  }


                  fun stop(
                      context: Context
                  ) {

                      context.stopService(
                          Intent(
                              context,
                              GameCaptureService::class.java
                          )
                      )
                  }
              }


              private val handler =
                  Handler(
                      Looper.getMainLooper()
                  )


              private var projection:
                  MediaProjection? = null


              private var virtualDisplay:
                  VirtualDisplay? = null


              private var imageReader:
                  ImageReader? = null


              private var screenWidth =
                  0

              private var screenHeight =
                  0

              private var density =
                  0


              private var processing =
                  false


              private val recognizer =
                  TextRecognition.getClient(
                      TextRecognizerOptions.DEFAULT_OPTIONS
                  )


              override fun onCreate() {

                  super.onCreate()

                  createNotificationChannel()


                  val notification =
                      NotificationCompat.Builder(
                          this,
                          CHANNEL_ID
                      )
                          .setContentTitle(
                              "사과게임 자동 플레이"
                          )
                          .setContentText(
                              "화면을 분석하고 있습니다."
                          )
                          .setSmallIcon(
                              android.R.drawable.ic_media_play
                          )
                          .setOngoing(true)
                          .build()


                  startForeground(
                      NOTIFICATION_ID,
                      notification
                  )
              }


              override fun onStartCommand(
                  intent: Intent?,
                  flags: Int,
                  startId: Int
              ): Int {

                  if (
                      projection == null
                  ) {

                      startCapture()
                  }


                  return START_NOT_STICKY
              }


              private fun startCapture() {

                  val data =
                      permissionData


                  if (
                      !hasPermission ||
                      data == null
                  ) {

                      stopSelf()

                      return
                  }


                  val manager =
                      getSystemService(
                          Context.MEDIA_PROJECTION_SERVICE
                      ) as MediaProjectionManager


                  try {

                      projection =
                          manager.getMediaProjection(
                              permissionResultCode,
                              data
                          )

                  } catch (
                      e: Exception
                  ) {

                      stopSelf()

                      return
                  }


                  val metrics =
                      resources.displayMetrics


                  screenWidth =
                      metrics.widthPixels

                  screenHeight =
                      metrics.heightPixels

                  density =
                      metrics.densityDpi


                  imageReader =
                      ImageReader.newInstance(
                          screenWidth,
                          screenHeight,
                          PixelFormat.RGBA_8888,
                          2
                      )


                  projection?.registerCallback(
                      object :
                          MediaProjection.Callback() {

                          override fun onStop() {

                              handler.post {
                                  stopSelf()
                              }
                          }

                      },
                      handler
                  )


                  virtualDisplay =
                      projection?.createVirtualDisplay(
                          "AppleGameCapture",
                          screenWidth,
                          screenHeight,
                          density,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          imageReader?.surface,
                          null,
                          handler
                      )


                  imageReader?.setOnImageAvailableListener(
                      { reader ->

                          if (!processing) {

                              processing =
                                  true


                              val image =
                                  reader.acquireLatestImage()


                              if (
                                  image != null
                              ) {

                                  processImage(
                                      image
                                  )

                              } else {

                                  processing =
                                      false
                              }
                          }

                      },
                      handler
                  )
              }


              private fun processImage(
                  image: Image
              ) {

                  try {

                      val bitmap =
                          imageToBitmap(
                              image
                          )


                      image.close()


                      if (
                          bitmap == null
                      ) {

                          processing =
                              false

                          return
                      }


                      recognizeBoard(
                          bitmap
                      )

                  } catch (
                      e: Exception
                  ) {

                      try {
                          image.close()
                      } catch (_: Exception) {
                      }


                      processing =
                          false
                  }
              }


              private fun imageToBitmap(
                  image: Image
              ): Bitmap? {

                  val plane =
                      image.planes.firstOrNull()
                          ?: return null


                  val buffer =
                      plane.buffer

                  val pixelStride =
                      plane.pixelStride

                  val rowStride =
                      plane.rowStride


                  val rowPadding =
                      rowStride -
                              pixelStride *
                              image.width


                  val bitmapWidth =
                      image.width +
                              rowPadding /
                              pixelStride


                  val bitmap =
                      Bitmap.createBitmap(
                          bitmapWidth,
                          image.height,
                          Bitmap.Config.ARGB_8888
                      )


                  buffer.rewind()

                  bitmap.copyPixelsFromBuffer(
                      buffer
                  )


                  return Bitmap.createBitmap(
                      bitmap,
                      0,
                      0,
                      image.width,
                      image.height
                  )
              }


              private fun recognizeBoard(
                  bitmap: Bitmap
              ) {

                  val image =
                      InputImage.fromBitmap(
                          bitmap,
                          0
                      )


                  recognizer
                      .process(image)
                      .addOnSuccessListener { result ->

                          val board =
                              Array(
                                  ROWS
                              ) {
                                  IntArray(
                                      COLS
                                  )
                              }


                          val scaleX =
                              screenWidth.toFloat() /
                                      REF_WIDTH


                          val scaleY =
                              screenHeight.toFloat() /
                                      REF_HEIGHT


                          for (
                              block in
                              result.textBlocks
                          ) {

                              for (
                                  line in
                                  block.lines
                              ) {

                                  for (
                                      element in
                                      line.elements
                                  ) {

                                      val raw =
                                          element.text
                                              .trim()


                                      if (
                                          raw.length != 1 ||
                                          raw[0] !in '1'..'9'
                                      ) {
                                          continue
                                      }


                                      val box =
                                          element.boundingBox
                                              ?: continue


                                      val centerX =
                                          (
                                              box.left +
                                                      box.right
                                              ) / 2f


                                      val centerY =
                                          (
                                              box.top +
                                                      box.bottom
                                              ) / 2f


                                      val refX =
                                          centerX /
                                                  scaleX


                                      val refY =
                                          centerY /
                                                  scaleY


                                      val col =
                                          (
                                              (
                                                  refX -
                                                          FIRST_X
                                              ) /
                                                      X_GAP
                                          ).toInt()


                                      val row =
                                          (
                                              (
                                                  refY -
                                                          FIRST_Y
                                              ) /
                                                      Y_GAP
                                          ).toInt()


                                      if (
                                          row in
                                          0 until ROWS &&
                                          col in
                                          0 until COLS
                                      ) {

                                          val expectedX =
                                              FIRST_X +
                                                      col *
                                                      X_GAP


                                          val expectedY =
                                              FIRST_Y +
                                                      row *
                                                      Y_GAP


                                          val distanceX =
                                              abs(
                                                  refX -
                                                          expectedX
                                              )


                                          val distanceY =
                                              abs(
                                                  refY -
                                                          expectedY
                                              )


                                          if (
                                              distanceX <
                                              CELL_TOLERANCE &&
                                              distanceY <
                                              CELL_TOLERANCE
                                          ) {

                                              board[row][col] =
                                                  raw.toInt()
                                          }
                                      }
                                  }
                              }
                          }


                          val move =
                              findSumTen(
                                  board
                              )


                          if (
                              move != null
                          ) {

                              performMove(
                                  move
                              )

                          } else {

                              processing =
                                  false
                          }

                      }
                      .addOnFailureListener {

                          processing =
                              false
                      }
              }


              private fun findSumTen(
                  board: Array<IntArray>
              ): Move? {

                  val prefix =
                      Array(
                          ROWS + 1
                      ) {
                          IntArray(
                              COLS + 1
                          )
                      }


                  for (
                      r in 0 until ROWS
                  ) {

                      for (
                          c in 0 until COLS
                      ) {

                          prefix[r + 1][c + 1] =
                              board[r][c] +
                                      prefix[r][c + 1] +
                                      prefix[r + 1][c] -
                                      prefix[r][c]
                      }
                  }


                  var best: Move? =
                      null

                  var bestArea =
                      Int.MAX_VALUE


                  for (
                      r1 in 0 until ROWS
                  ) {

                      for (
                          c1 in 0 until COLS
                      ) {

                          for (
                              r2 in r1 until ROWS
                          ) {

                              for (
                                  c2 in c1 until COLS
                              ) {

                                  val sum =
                                      prefix[r2 + 1][c2 + 1] -
                                              prefix[r1][c2 + 1] -
                                              prefix[r2 + 1][c1] +
                                              prefix[r1][c1]


                                  if (
                                      sum == 10
                                  ) {

                                      val area =
                                          (
                                              r2 -
                                                      r1 +
                                                      1
                                          ) *
                                                  (
                                                      c2 -
                                                              c1 +
                                                              1
                                                  )


                                      if (
                                          area <
                                          bestArea
                                      ) {

                                          bestArea =
                                              area


                                          best =
                                              Move(
                                                  r1,
                                                  c1,
                                                  r2,
                                                  c2
                                              )
                                      }
                                  }
                              }
                          }
                      }
                  }


                  return best
              }


              private fun performMove(
                  move: Move
              ) {

                  val scaleX =
                      screenWidth.toFloat() /
                              REF_WIDTH


                  val scaleY =
                      screenHeight.toFloat() /
                              REF_HEIGHT


                  val startX =
                      (
                          FIRST_X +
                                  move.c1 *
                                  X_GAP
                      ) *
                              scaleX


                  val startY =
                      (
                          FIRST_Y +
                                  move.r1 *
                                  Y_GAP
                      ) *
                              scaleY


                  val endX =
                      (
                          FIRST_X +
                                  move.c2 *
                                  X_GAP
                      ) *
                              scaleX


                  val endY =
                      (
                          FIRST_Y +
                                  move.r2 *
                                  Y_GAP
                      ) *
                              scaleY


                  val service =
                      AppleAccessibilityService.instance


                  if (
                      service == null
                  ) {

                      processing =
                          false

                      return
                  }


                  service.swipe(
                      startX,
                      startY,
                      endX,
                      endY,
                      180L
                  )


                  handler.postDelayed(
                      {

                          processing =
                              false

                      },
                      550L
                  )
              }


              private fun createNotificationChannel() {

                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.O
                  ) {

                      val channel =
                          NotificationChannel(
                              CHANNEL_ID,
                              "사과게임 자동 플레이",
                              NotificationManager.IMPORTANCE_LOW
                          )


                      val manager =
                          getSystemService(
                              NotificationManager::class.java
                          )


                      manager.createNotificationChannel(
                          channel
                      )
                  }
              }


              override fun onDestroy() {

                  processing =
                      false


                  handler.removeCallbacksAndMessages(
                      null
                  )


                  imageReader?.close()

                  imageReader =
                      null


                  virtualDisplay?.release()

                  virtualDisplay =
                      null


                  projection?.stop()

                  projection =
                      null


                  recognizer.close()


                  super.onDestroy()
              }


              override fun onBind(
                  intent: Intent?
              ): IBinder? {

                  return null
              }


              data class Move(

                  val r1: Int,

                  val c1: Int,

                  val r2: Int,

                  val c2: Int
              )
          }
