name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/example/applegameauto
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AppleGameAuto"

          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.applegameauto'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.applegameauto'
                  minSdk 26
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false

                      proguardFiles(
                          getDefaultProguardFile(
                              'proguard-android-optimize.txt'
                          ),
                          'proguard-rules.pro'
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'

              implementation 'com.google.mlkit:text-recognition:16.0.1'
          }
          EOF

          cat > app/proguard-rules.pro <<'EOF'
          # No custom ProGuard rules.
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".AppleAccessibilityService"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

                  <service
                      android:name=".GameCaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">
                  사과게임 자동 플레이
              </string>

              <string name="accessibility_service_description">
                  사과게임의 숫자를 선택하기 위해 화면을 드래그합니다.
              </string>

          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="Theme.Material3.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowLightStatusBar">
                      true
                  </item>

                  <item name="android:statusBarColor">
                      #FFFFFF
                  </item>

                  <item name="android:navigationBarColor">
                      #FFFFFF
                  </item>

              </style>

          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"

              android:description="@string/accessibility_service_description"

              android:accessibilityEventTypes="typeAllMask"

              android:accessibilityFeedbackType="feedbackGeneric"

              android:notificationTimeout="100"

              android:canRetrieveWindowContent="false"

              android:canPerformGestures="true" />

          EOF

          cat > app/src/main/java/com/example/applegameauto/MainActivity.kt <<'EOF'
          package com.example.applegameauto

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.os.Bundle
          import android.provider.Settings
          import android.graphics.Color
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import java.util.Locale

          class MainActivity : Activity() {

              companion object {
                  private const val REQUEST_CAPTURE = 1001

                  const val EXTRA_RESULT_CODE =
                      "capture_result_code"

                  const val EXTRA_DATA =
                      "capture_data"
              }

              private lateinit var statusText: TextView

              private var captureResultCode: Int? = null

              private var captureData: Intent? = null

              private val handler =
                  android.os.Handler(
                      android.os.Looper.getMainLooper()
                  )

              private val statusRunnable =
                  object : Runnable {

                      override fun run() {
                          updateStatus()

                          handler.postDelayed(
                              this,
                              500L
                          )
                      }
                  }

              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {
                  super.onCreate(savedInstanceState)

                  createUi()

                  handler.post(statusRunnable)
              }

              private fun createUi() {

                  val root =
                      ScrollView(this)

                  val layout =
                      LinearLayout(this)

                  layout.orientation =
                      LinearLayout.VERTICAL

                  layout.setPadding(
                      40,
                      50,
                      40,
                      40
                  )

                  val title =
                      TextView(this)

                  title.text =
                      "🍎 사과게임 자동 플레이"

                  title.textSize =
                      25f

                  title.setTextColor(
                      Color.BLACK
                  )

                  title.setPadding(
                      0,
                      0,
                      0,
                      30
                  )

                  val info =
                      TextView(this)

                  info.text =
                      """
                      사용 순서

                      1. 접근성 서비스를 켭니다.
                      2. 화면 캡처 권한을 허용합니다.
                      3. 사과게임 화면으로 이동합니다.
                      4. 자동 플레이를 시작합니다.

                      아래 상태창에서
                      실제로 숫자를 인식하고 있는지
                      확인할 수 있습니다.
                      """.trimIndent()

                  info.textSize =
                      16f

                  info.setPadding(
                      0,
                      0,
                      0,
                      25
                  )

                  val accessibilityButton =
                      Button(this)

                  accessibilityButton.text =
                      "① 접근성 서비스 설정"

                  accessibilityButton.setOnClickListener {

                      try {

                          startActivity(
                              Intent(
                                  Settings.ACTION_ACCESSIBILITY_SETTINGS
                              )
                          )

                      } catch (e: Exception) {

                          Toast.makeText(
                              this,
                              "접근성 설정을 열 수 없습니다.",
                              Toast.LENGTH_SHORT
                          ).show()

                      }
                  }

                  val captureButton =
                      Button(this)

                  captureButton.text =
                      "② 화면 캡처 권한 허용"

                  captureButton.setOnClickListener {

                      requestScreenCapture()

                  }

                  val startButton =
                      Button(this)

                  startButton.text =
                      "③ 자동 플레이 시작"

                  startButton.setOnClickListener {

                      startAutomaticPlay()

                  }

                  val testButton =
                      Button(this)

                  testButton.text =
                      "접근성 테스트 드래그"

                  testButton.setOnClickListener {

                      val service =
                          AppleAccessibilityService.instance

                      if (service == null) {

                          Toast.makeText(
                              this,
                              "접근성 서비스가 연결되지 않았습니다.",
                              Toast.LENGTH_LONG
                          ).show()

                          return@setOnClickListener
                      }

                      service.testSwipe()

                  }

                  val stopButton =
                      Button(this)

                  stopButton.text =
                      "④ 자동 플레이 중지"

                  stopButton.setOnClickListener {

                      GameCaptureService.stop(this)

                      Toast.makeText(
                          this,
                          "자동 플레이를 중지했습니다.",
                          Toast.LENGTH_SHORT
                      ).show()

                  }

                  statusText =
                      TextView(this)

                  statusText.textSize =
                      16f

                  statusText.setTextColor(
                      Color.DKGRAY
                  )

                  statusText.setPadding(
                      20,
                      30,
                      20,
                      30
                  )

                  statusText.gravity =
                      Gravity.START

                  layout.addView(title)
                  layout.addView(info)
                  layout.addView(accessibilityButton)
                  layout.addView(captureButton)
                  layout.addView(startButton)
                  layout.addView(testButton)
                  layout.addView(stopButton)
                  layout.addView(statusText)

                  root.addView(layout)

                  setContentView(root)
              }

              private fun requestScreenCapture() {

                  val manager =
                      getSystemService(
                          Context.MEDIA_PROJECTION_SERVICE
                      ) as MediaProjectionManager

                  try {

                      startActivityForResult(
                          manager.createScreenCaptureIntent(),
                          REQUEST_CAPTURE
                      )

                  } catch (e: Exception) {

                      Toast.makeText(
                          this,
                          "화면 캡처 권한 요청 실패",
                          Toast.LENGTH_LONG
                      ).show()

                  }
              }

              private fun startAutomaticPlay() {

                  if (
                      !AppleAccessibilityService.isEnabled ||
                      AppleAccessibilityService.instance == null
                  ) {

                      Toast.makeText(
                          this,
                          "먼저 접근성 서비스를 켜주세요.",
                          Toast.LENGTH_LONG
                      ).show()

                      return
                  }

                  val resultCode =
                      captureResultCode

                  val data =
                      captureData

                  if (
                      resultCode == null ||
                      data == null
                  ) {

                      Toast.makeText(
                          this,
                          "먼저 '② 화면 캡처 권한 허용'을 눌러주세요.",
                          Toast.LENGTH_LONG
                      ).show()

                      return
                  }

                  val serviceIntent =
                      Intent(
                          this,
                          GameCaptureService::class.java
                      )

                  serviceIntent.putExtra(
                      GameCaptureService.EXTRA_RESULT_CODE,
                      resultCode
                  )

                  serviceIntent.putExtra(
                      GameCaptureService.EXTRA_DATA,
                      data
                  )

                  try {

                      if (
                          android.os.Build.VERSION.SDK_INT >=
                          android.os.Build.VERSION_CODES.O
                      ) {

                          startForegroundService(
                              serviceIntent
                          )

                      } else {

                          startService(
                              serviceIntent
                          )

                      }

                      /*
                       * MediaProjection 권한 Intent는
                       * 한 번 사용한 뒤 다시 사용하지 않는다.
                       */
                      captureResultCode = null
                      captureData = null

                      Toast.makeText(
                          this,
                          "자동 플레이를 시작했습니다.",
                          Toast.LENGTH_SHORT
                      ).show()

                  } catch (e: Exception) {

                      Toast.makeText(
                          this,
                          "자동 플레이 시작 실패: ${e.message}",
                          Toast.LENGTH_LONG
                      ).show()

                  }
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  )

                  if (
                      requestCode == REQUEST_CAPTURE &&
                      resultCode == RESULT_OK &&
                      data != null
                  ) {

                      captureResultCode =
                          resultCode

                      captureData =
                          data

                      Toast.makeText(
                          this,
                          "화면 캡처 권한이 준비되었습니다.",
                          Toast.LENGTH_SHORT
                      ).show()

                  } else if (
                      requestCode == REQUEST_CAPTURE
                  ) {

                      captureResultCode =
                          null

                      captureData =
                          null

                      Toast.makeText(
                          this,
                          "화면 캡처 권한이 취소되었습니다.",
                          Toast.LENGTH_SHORT
                      ).show()
                  }
              }

              private fun updateStatus() {

                  if (!::statusText.isInitialized) {
                      return
                  }

                  val prefs =
                      getSharedPreferences(
                          "apple_game_status",
                          Context.MODE_PRIVATE
                      )

                  val accessibility =
                      if (
                          AppleAccessibilityService.isEnabled
                      ) {
                          "✅ 연결됨"
                      } else {
                          "❌ 연결 안 됨"
                      }

                  val capture =
                      prefs.getString(
                          "capture",
                          "대기"
                      )

                  val ocr =
                      prefs.getInt(
                          "ocr_count",
                          0
                      )

                  val move =
                      prefs.getString(
                          "move",
                          "아직 찾지 않음"
                      )

                  val gesture =
                      prefs.getString(
                          "gesture",
                          "대기"
                      )

                  val error =
                      prefs.getString(
                          "error",
                          ""
                      )

                  val running =
                      prefs.getBoolean(
                          "running",
                          false
                      )

                  val runningText =
                      if (running) {
                          "🟢 실행 중"
                      } else {
                          "⚪ 대기 중"
                      }

                  statusText.text =
                      String.format(
                          Locale.KOREA,
                          """
                          ────────────────────
                          현재 상태

                          자동 플레이:
                          %s

                          접근성 서비스:
                          %s

                          화면 캡처:
                          %s

                          인식된 숫자:
                          %d개

                          합계 10:
                          %s

                          마지막 드래그:
                          %s

                          드래그 결과:
                          %s

                          오류:
                          %s
                          ────────────────────
                          """.trimIndent(),
                          runningText,
                          accessibility,
                          capture,
                          ocr,
                          move,
                          prefs.getString(
                              "last_move",
                              "-"
                          ),
                          gesture,
                          if (error.isEmpty()) {
                              "없음"
                          } else {
                              error
                          }
                      )
              }

              override fun onDestroy() {

                  handler.removeCallbacks(
                      statusRunnable
                  )

                  super.onDestroy()
              }
          }
          EOF

          cat > app/src/main/java/com/example/applegameauto/AppleAccessibilityService.kt <<'EOF'
          package com.example.applegameauto

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.os.Build
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Toast

          class AppleAccessibilityService :
              AccessibilityService() {

              companion object {

                  @Volatile
                  var instance:
                      AppleAccessibilityService? = null

                  @Volatile
                  var isEnabled:
                      Boolean = false
              }

              override fun onServiceConnected() {

                  super.onServiceConnected()

                  instance = this

                  isEnabled = true

                  saveStatus(
                      "accessibility",
                      "connected"
                  )
              }

              override fun onAccessibilityEvent(
                  event: AccessibilityEvent?
              ) {
              }

              override fun onInterrupt() {
              }

              override fun onDestroy() {

                  isEnabled = false

                  if (instance === this) {
                      instance = null
                  }

                  super.onDestroy()
              }

              fun swipe(
                  startX: Float,
                  startY: Float,
                  endX: Float,
                  endY: Float,
                  duration: Long = 180L,
                  callback: ((Boolean) -> Unit)? = null
              ) {

                  if (
                      Build.VERSION.SDK_INT <
                      Build.VERSION_CODES.N
                  ) {

                      callback?.invoke(false)

                      return
                  }

                  val path =
                      Path()

                  path.moveTo(
                      startX,
                      startY
                  )

                  path.lineTo(
                      endX,
                      endY
                  )

                  val stroke =
                      GestureDescription.StrokeDescription(
                          path,
                          0L,
                          duration
                      )

                  val gesture =
                      GestureDescription.Builder()
                          .addStroke(stroke)
                          .build()

                  val dispatched =
                      dispatchGesture(
                          gesture,
                          object :
                              GestureResultCallback() {

                              override fun onCompleted(
                                  gestureDescription:
                                  GestureDescription?
                              ) {

                                  saveStatus(
                                      "gesture",
                                      "success"
                                  )

                                  callback?.invoke(
                                      true
                                  )
                              }

                              override fun onCancelled(
                                  gestureDescription:
                                  GestureDescription?
                              ) {

                                  saveStatus(
                                      "gesture",
                                      "cancelled"
                                  )

                                  callback?.invoke(
                                      false
                                  )
                              }
                          },
                          null
                      )

                  if (!dispatched) {

                      saveStatus(
                          "gesture",
                          "dispatch_failed"
                      )

                      callback?.invoke(false)
                  }
              }

              fun testSwipe() {

                  val dm =
                      resources.displayMetrics

                  val cx =
                      dm.widthPixels / 2f

                  val cy =
                      dm.heightPixels / 2f

                  swipe(
                      cx - 150f,
                      cy,
                      cx + 150f,
                      cy,
                      500L
                  )
              }

              private fun saveStatus(
                  key: String,
                  value: String
              ) {

                  getSharedPreferences(
                      "apple_game_status",
                      MODE_PRIVATE
                  )
                      .edit()
                      .putString(
                          key,
                          value
                      )
                      .apply()
              }
          }
          EOF

          cat > app/src/main/java/com/example/applegameauto/GameCaptureService.kt <<'EOF'
          package com.example.applegameauto

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.Rect
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.Image
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import androidx.core.app.NotificationCompat
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import kotlin.math.abs

          class GameCaptureService :
              Service() {

              companion object {

                  const val EXTRA_RESULT_CODE =
                      "capture_result_code"

                  const val EXTRA_DATA =
                      "capture_data"

                  private const val CHANNEL_ID =
                      "apple_game_auto"

                  private const val NOTIFICATION_ID =
                      100

                  /*
                   * 기준 화면:
                   *
                   * 1536 x 960
                   *
                   * 18열 x 9행
                   */
                  private const val REF_WIDTH =
                      1536f

                  private const val REF_HEIGHT =
                      960f

                  private const val ROWS =
                      9

                  private const val COLS =
                      18

                  private const val FIRST_X =
                      96f

                  private const val FIRST_Y =
                      200f

                  private const val X_GAP =
                      78.3f

                  private const val Y_GAP =
                      78.3f

                  private const val CELL_TOLERANCE =
                      40f

                  private const val BOARD_MARGIN =
                      55f

                  @Volatile
                  private var running =
                      false

                  fun stop(context: Context) {

                      context.stopService(
                          Intent(
                              context,
                              GameCaptureService::class.java
                          )
                      )
                  }
              }

              private val handler =
                  Handler(
                      Looper.getMainLooper()
                  )

              private var projection:
                  MediaProjection? = null

              private var virtualDisplay:
                  VirtualDisplay? = null

              private var imageReader:
                  ImageReader? = null

              private var screenWidth =
                  0

              private var screenHeight =
                  0

              private var density =
                  0

              private var processing =
                  false

              private val recognizer =
                  TextRecognition.getClient(
                      TextRecognizerOptions.DEFAULT_OPTIONS
                  )

              override fun onCreate() {

                  super.onCreate()

                  createNotificationChannel()

                  val notification =
                      NotificationCompat.Builder(
                          this,
                          CHANNEL_ID
                      )
                          .setContentTitle(
                              "사과게임 자동 플레이"
                          )
                          .setContentText(
                              "화면을 분석하고 있습니다."
                          )
                          .setSmallIcon(
                              android.R.drawable.ic_media_play
                          )
                          .setOngoing(true)
                          .build()

                  /*
                   * Android 10+
                   * MediaProjection foreground service type
                   */
                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.Q
                  ) {

                      startForeground(
                          NOTIFICATION_ID,
                          notification,
                          ServiceInfo
                              .FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION
                      )

                  } else {

                      startForeground(
                          NOTIFICATION_ID,
                          notification
                      )
                  }
              }

              override fun onStartCommand(
                  intent: Intent?,
                  flags: Int,
                  startId: Int
              ): Int {

                  if (running) {
                      return START_NOT_STICKY
                  }

                  val resultCode =
                      intent?.getIntExtra(
                          EXTRA_RESULT_CODE,
                          -1
                      ) ?: -1

                  @Suppress("DEPRECATION")
                  val data =
                      intent?.getParcelableExtra(
                          EXTRA_DATA
                      ) as? Intent

                  if (
                      resultCode == -1 ||
                      data == null
                  ) {

                      setError(
                          "화면 캡처 권한 데이터 없음"
                      )

                      stopSelf()

                      return START_NOT_STICKY
                  }

                  running = true

                  saveRunning(true)

                  handler.post {
                      startCapture(
                          resultCode,
                          data
                      )
                  }

                  return START_NOT_STICKY
              }

              private fun startCapture(
                  resultCode: Int,
                  data: Intent
              ) {

                  try {

                      val manager =
                          getSystemService(
                              Context.MEDIA_PROJECTION_SERVICE
                          ) as MediaProjectionManager

                      projection =
                          manager.getMediaProjection(
                              resultCode,
                              data
                          )

                      if (projection == null) {

                          setError(
                              "MediaProjection 생성 실패"
                          )

                          stopSelf()

                          return
                      }

                      val metrics =
                          resources.displayMetrics

                      screenWidth =
                          metrics.widthPixels

                      screenHeight =
                          metrics.heightPixels

                      density =
                          metrics.densityDpi

                      imageReader =
                          ImageReader.newInstance(
                              screenWidth,
                              screenHeight,
                              PixelFormat.RGBA_8888,
                              2
                          )

                      projection?.registerCallback(
                          object :
                              MediaProjection.Callback() {

                              override fun onStop() {

                                  handler.post {

                                      setCaptureStatus(
                                          "중지됨"
                                      )

                                      stopSelf()
                                  }
                              }
                          },
                          handler
                      )

                      virtualDisplay =
                          projection?.createVirtualDisplay(
                              "AppleGameCapture",
                              screenWidth,
                              screenHeight,
                              density,
                              DisplayManager
                                  .VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                              imageReader?.surface,
                              null,
                              handler
                          )

                      imageReader?.setOnImageAvailableListener(
                          { reader ->

                              if (processing) {
                                  return@setOnImageAvailableListener
                              }

                              processing = true

                              val image =
                                  try {
                                      reader
                                          .acquireLatestImage()
                                  } catch (
                                      _: Exception
                                  ) {
                                      null
                                  }

                              if (image == null) {

                                  processing = false

                              } else {

                                  processImage(
                                      image
                                  )
                              }

                          },
                          handler
                      )

                      setCaptureStatus(
                          "연결됨"
                      )

                  } catch (
                      e: SecurityException
                  ) {

                      setError(
                          "화면 캡처 보안 오류: ${e.message}"
                      )

                      stopSelf()

                  } catch (
                      e: Exception
                  ) {

                      setError(
                          "캡처 시작 오류: ${e.message}"
                      )

                      stopSelf()
                  }
              }

              private fun processImage(
                  image: Image
              ) {

                  try {

                      val bitmap =
                          imageToBitmap(
                              image
                          )

                      image.close()

                      if (bitmap == null) {

                          processing = false

                          return
                      }

                      recognizeBoard(
                          bitmap
                      )

                  } catch (
                      e: Exception
                  ) {

                      try {
                          image.close()
                      } catch (
                          _: Exception
                      ) {
                      }

                      setError(
                          "이미지 처리 오류: ${e.message}"
                      )

                      processing = false
                  }
              }

              private fun imageToBitmap(
                  image: Image
              ): Bitmap? {

                  val plane =
                      image.planes.firstOrNull()
                          ?: return null

                  val buffer =
                      plane.buffer

                  val pixelStride =
                      plane.pixelStride

                  val rowStride =
                      plane.rowStride

                  val rowPadding =
                      rowStride -
                          pixelStride *
                          image.width

                  val bitmapWidth =
                      image.width +
                          rowPadding /
                          pixelStride

                  val bitmap =
                      Bitmap.createBitmap(
                          bitmapWidth,
                          image.height,
                          Bitmap.Config.ARGB_8888
                      )

                  buffer.rewind()

                  bitmap.copyPixelsFromBuffer(
                      buffer
                  )

                  return Bitmap.createBitmap(
                      bitmap,
                      0,
                      0,
                      image.width,
                      image.height
                  )
              }

              private fun recognizeBoard(
                  bitmap: Bitmap
              ) {

                  /*
                   * 실제 캡처 이미지의 크기를 사용한다.
                   */
                  val captureWidth =
                      bitmap.width.toFloat()

                  val captureHeight =
                      bitmap.height.toFloat()

                  val scaleX =
                      captureWidth /
                          REF_WIDTH

                  val scaleY =
                      captureHeight /
                          REF_HEIGHT

                  val refLeft =
                      FIRST_X -
                          BOARD_MARGIN

                  val refTop =
                      FIRST_Y -
                          BOARD_MARGIN

                  val refRight =
                      FIRST_X +
                          (COLS - 1) *
                          X_GAP +
                          BOARD_MARGIN

                  val refBottom =
                      FIRST_Y +
                          (ROWS - 1) *
                          Y_GAP +
                          BOARD_MARGIN

                  val cropLeft =
                      (
                          refLeft *
                              scaleX
                      )
                          .toInt()
                          .coerceIn(
                              0,
                              bitmap.width - 1
                          )

                  val cropTop =
                      (
                          refTop *
                              scaleY
                      )
                          .toInt()
                          .coerceIn(
                              0,
                              bitmap.height - 1
                          )

                  val cropRight =
                      (
                          refRight *
                              scaleX
                      )
                          .toInt()
                          .coerceIn(
                              cropLeft + 1,
                              bitmap.width
                          )

                  val cropBottom =
                      (
                          refBottom *
                              scaleY
                      )
                          .toInt()
                          .coerceIn(
                              cropTop + 1,
                              bitmap.height
                          )

                  val crop =
                      Bitmap.createBitmap(
                          bitmap,
                          cropLeft,
                          cropTop,
                          cropRight -
                              cropLeft,
                          cropBottom -
                              cropTop
                      )

                  val image =
                      InputImage.fromBitmap(
                          crop,
                          0
                      )

                  recognizer
                      .process(image)
                      .addOnSuccessListener { result ->

                          try {

                              val board =
                                  Array(
                                      ROWS
                                  ) {
                                      IntArray(
                                          COLS
                                      )
                                  }

                              var recognizedCount =
                                  0

                              for (
                                  block
                                  in result.textBlocks
                              ) {

                                  for (
                                      line
                                      in block.lines
                                  ) {

                                      for (
                                          element
                                          in line.elements
                                      ) {

                                          val raw =
                                              element.text
                                                  .trim()

                                          if (
                                              raw.length != 1 ||
                                              raw[0] !in
                                              '1'..'9'
                                          ) {
                                              continue
                                          }

                                          val box =
                                              element
                                                  .boundingBox
                                                  ?: continue

                                          /*
                                           * OCR 좌표는
                                           * crop 기준이므로
                                           * 원본 기준으로 복구한다.
                                           */
                                          val centerX =
                                              (
                                                  box.left +
                                                      box.right
                                              ) /
                                                  2f +
                                                  cropLeft

                                          val centerY =
                                              (
                                                  box.top +
                                                      box.bottom
                                              ) /
                                                  2f +
                                                  cropTop

                                          val refX =
                                              centerX /
                                                  scaleX

                                          val refY =
                                              centerY /
                                                  scaleY

                                          val col =
                                              (
                                                  (
                                                      refX -
                                                          FIRST_X
                                                  ) /
                                                      X_GAP
                                              )
                                                  .toInt()

                                          val row =
                                              (
                                                  (
                                                      refY -
                                                          FIRST_Y
                                                  ) /
                                                      Y_GAP
                                              )
                                                  .toInt()

                                          if (
                                              row in
                                              0 until ROWS &&
                                              col in
                                              0 until COLS
                                          ) {

                                              val expectedX =
                                                  FIRST_X +
                                                      col *
                                                      X_GAP

                                              val expectedY =
                                                  FIRST_Y +
                                                      row *
                                                      Y_GAP

                                              val distanceX =
                                                  abs(
                                                      refX -
                                                          expectedX
                                                  )

                                              val distanceY =
                                                  abs(
                                                      refY -
                                                          expectedY
                                                  )

                                              if (
                                                  distanceX <
                                                  CELL_TOLERANCE &&
                                                  distanceY <
                                                  CELL_TOLERANCE
                                              ) {

                                                  if (
                                                      board[row][col] ==
                                                      0
                                                  ) {

                                                      board[row][col] =
                                                          raw.toInt()

                                                      recognizedCount++
                                                  }
                                              }
                                          }
                                      }
                                  }
                              }

                              saveOcrCount(
                                  recognizedCount
                              )

                              if (
                                  recognizedCount == 0
                              ) {

                                  setMoveStatus(
                                      "숫자를 찾지 못함"
                                  )

                                  processing =
                                      false

                                  return@addOnSuccessListener
                              }

                              val move =
                                  findSumTen(
                                      board
                                  )

                              if (move == null) {

                                  setMoveStatus(
                                      "합계 10 영역 없음"
                                  )

                                  processing =
                                      false

                                  return@addOnSuccessListener
                              }

                              val moveText =
                                  "(${move.r1 + 1},${move.c1 + 1}) → " +
                                      "(${move.r2 + 1},${move.c2 + 1})"

                              saveLastMove(
                                  moveText
                              )

                              setMoveStatus(
                                  "발견"
                              )

                              performMove(
                                  move
                              )

                          } catch (
                              e: Exception
                          ) {

                              setError(
                                  "OCR 결과 처리 오류: ${e.message}"
                              )

                              processing =
                                  false
                          }

                      }
                      .addOnFailureListener { e ->

                          setError(
                              "OCR 실패: ${e.message}"
                          )

                          processing =
                              false
                      }
              }

              private fun findSumTen(
                  board: Array<IntArray>
              ): Move? {

                  val prefix =
                      Array(
                          ROWS + 1
                      ) {
                          IntArray(
                              COLS + 1
                          )
                      }

                  for (
                      r in 0 until ROWS
                  ) {

                      for (
                          c in 0 until COLS
                      ) {

                          prefix[r + 1][c + 1] =
                              board[r][c] +
                                  prefix[r][c + 1] +
                                  prefix[r + 1][c] -
                                  prefix[r][c]
                      }
                  }

                  var best:
                      Move? = null

                  var bestArea =
                      Int.MAX_VALUE

                  for (
                      r1 in 0 until ROWS
                  ) {

                      for (
                          c1 in 0 until COLS
                      ) {

                          for (
                              r2 in r1 until ROWS
                          ) {

                              for (
                                  c2 in c1 until COLS
                              ) {

                                  val sum =
                                      prefix[r2 + 1][c2 + 1] -
                                          prefix[r1][c2 + 1] -
                                          prefix[r2 + 1][c1] +
                                          prefix[r1][c1]

                                  if (
                                      sum == 10
                                  ) {

                                      val area =
                                          (
                                              r2 -
                                                  r1 +
                                                  1
                                          ) *
                                              (
                                                  c2 -
                                                      c1 +
                                                      1
                                              )

                                      if (
                                          area <
                                          bestArea
                                      ) {

                                          bestArea =
                                              area

                                          best =
                                              Move(
                                                  r1,
                                                  c1,
                                                  r2,
                                                  c2
                                              )
                                      }
                                  }
                              }
                          }
                      }
                  }

                  return best
              }

              private fun performMove(
                  move: Move
              ) {

                  val scaleX =
                      screenWidth.toFloat() /
                          REF_WIDTH

                  val scaleY =
                      screenHeight.toFloat() /
                          REF_HEIGHT

                  val startX =
                      (
                          FIRST_X +
                              move.c1 *
                              X_GAP
                      ) *
                          scaleX

                  val startY =
                      (
                          FIRST_Y +
                              move.r1 *
                              Y_GAP
                      ) *
                          scaleY

                  val endX =
                      (
                          FIRST_X +
                              move.c2 *
                              X_GAP
                      ) *
                          scaleX

                  val endY =
                      (
                          FIRST_Y +
                              move.r2 *
                              Y_GAP
                      ) *
                          scaleY

                  val service =
                      AppleAccessibilityService
                          .instance

                  if (
                      service == null
                  ) {

                      setError(
                          "접근성 서비스가 사라짐"
                      )

                      processing =
                          false

                      return
                  }

                  service.swipe(
                      startX,
                      startY,
                      endX,
                      endY,
                      180L
                  ) { success ->

                      if (success) {

                          saveGesture(
                              "✅ 성공"
                          )

                      } else {

                          saveGesture(
                              "❌ 실패"
                          )
                      }

                      /*
                       * 다음 화면을 다시 분석한다.
                       */
                      handler.postDelayed(
                          {
                              processing =
                                  false
                          },
                          500L
                      )
                  }
              }

              private fun createNotificationChannel() {

                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.O
                  ) {

                      val channel =
                          NotificationChannel(
                              CHANNEL_ID,
                              "사과게임 자동 플레이",
                              NotificationManager
                                  .IMPORTANCE_LOW
                          )

                      val manager =
                          getSystemService(
                              NotificationManager::class.java
                          )

                      manager.createNotificationChannel(
                          channel
                      )
                  }
              }

              private fun prefs() =
                  getSharedPreferences(
                      "apple_game_status",
                      Context.MODE_PRIVATE
                  )

              private fun setCaptureStatus(
                  value: String
              ) {

                  prefs()
                      .edit()
                      .putString(
                          "capture",
                          value
                      )
                      .apply()
              }

              private fun saveOcrCount(
                  count: Int
              ) {

                  prefs()
                      .edit()
                      .putInt(
                          "ocr_count",
                          count
                      )
                      .apply()
              }

              private fun setMoveStatus(
                  value: String
              ) {

                  prefs()
                      .edit()
                      .putString(
                          "move",
                          value
                      )
                      .apply()
              }

              private fun saveLastMove(
                  value: String
              ) {

                  prefs()
                      .edit()
                      .putString(
                          "last_move",
                          value
                      )
                      .apply()
              }

              private fun saveGesture(
                  value: String
              ) {

                  prefs()
                      .edit()
                      .putString(
                          "gesture",
                          value
                      )
                      .apply()
              }

              private fun saveRunning(
                  value: Boolean
              ) {

                  prefs()
                      .edit()
                      .putBoolean(
                          "running",
                          value
                      )
                      .apply()
              }

              private fun setError(
                  value: String
              ) {

                  prefs()
                      .edit()
                      .putString(
                          "error",
                          value
                      )
                      .apply()
              }

              override fun onDestroy() {

                  running = false

                  saveRunning(false)

                  processing = false

                  handler.removeCallbacksAndMessages(
                      null
                  )

                  imageReader?.setOnImageAvailableListener(
                      null,
                      null
                  )

                  imageReader?.close()

                  imageReader = null

                  virtualDisplay?.release()

                  virtualDisplay = null

                  try {
                      projection?.stop()
                  } catch (
                      _: Exception
                  ) {
                  }

                  projection = null

                  recognizer.close()

                  super.onDestroy()
              }

              override fun onBind(
                  intent: Intent?
              ): IBinder? {
                  return null
              }

              data class Move(
                  val r1: Int,
                  val c1: Int,
                  val r2: Int,
                  val c2: Int
              )
          }
          EOF

      - name: Check Gradle
        run: |
          gradle --version
          gradle tasks --no-daemon

      - name: Clean
        run: |
          gradle clean \
            --no-daemon \
            --stacktrace

      - name: Build APK
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppleGameAuto-v2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
